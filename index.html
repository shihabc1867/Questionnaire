<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionnaire</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a2e;--mute:#68777b;--line:#d9dfdc;--brand:#0f5c5a;--on:#fff;--warn:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121a1b;--card:#1a2426;--ink:#e8eeee;--mute:#93a3a6;--line:#2b3a3c;--brand:#4fb3ad;--on:#0b1f1e;--warn:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Hind Siliguri',system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 70px}
h1{font-size:26px;margin:6px 0 2px}h2{font-size:20px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 14px}
.card,.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.box{display:flex;align-items:center;gap:8px;padding:14px 16px;cursor:pointer;border-left:5px solid var(--brand)}
.box.sm{padding:10px 12px;border-left-width:3px;margin-bottom:8px}
.box b{flex:1;font-weight:600;word-break:break-word}
.indent{margin-left:14px}
label{display:block;font-weight:600;margin:10px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--brand);color:var(--on);cursor:pointer;width:100%;margin-top:12px}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
button.ic{width:34px;height:34px;padding:0;margin:0;flex:none;background:transparent;color:var(--mute);border:1px solid var(--line)}
button.ic:disabled{opacity:.3}
.nav{display:flex;gap:8px;margin:0 0 14px}
.nav button{margin:0;background:transparent;color:var(--mute);border:1px solid var(--line)}
.nav button.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.msg{margin-top:10px;color:var(--warn);min-height:1.4em}.ok{color:var(--brand)}
.cred{background:var(--bg);border:1px dashed var(--brand);border-radius:8px;padding:12px;margin-top:12px;word-break:break-all}
.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px;background:var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row button{width:auto;margin:0;padding:6px 10px}
.empty{color:var(--mute);padding:6px 0}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Questionnaire</h1>
<p class="sub" id="sub">Build question papers and download them as PDF.</p>

<section id="auth">
  <div class="nav"><button id="tLogin" class="on">Log in</button><button id="tReg">Create account</button></div>
  <div class="card" id="loginBox">
    <label>ID (mobile number)</label><input id="lId" autocapitalize="none" autocomplete="username">
    <label>Password</label><input id="lPass" type="password" autocomplete="current-password">
    <button id="bLogin">Log in</button>
  </div>
  <div class="card hide" id="regBox">
    <label>Name</label><input id="rName">
    <label>Mobile number</label><input id="rMobile" inputmode="numeric" placeholder="01XXXXXXXXX">
    <label>Secret code</label><input id="rCode" autocapitalize="characters">
    <button id="bReg">Get my ID and password</button>
    <div id="cred"></div>
  </div>
  <div class="msg" id="authMsg"></div>
</section>

<section id="app" class="hide">
  <div class="nav"><button id="nLib" class="on">Library</button><button id="nPro">Profile</button></div>
  <div id="view"></div>
</section>
</main>

<script>
// Paste your Apps Script Web App URL here
const API = 'https://script.google.com/macros/s/AKfycbxX17--tEHhOgkSq_Z0XyvnXhHFvUJ8SgNRkMj6se58ay2d1LCoig2shRfhvdgraZ7J/exec';

const $ = id => document.getElementById(id);
let token = localStorage.getItem('qtoken') || '', me = null, tree = null, openFolder = null;
const isAdmin = () => me && me.role === 'admin';

async function call(action, data = {}) {
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token, ...data }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function run(btn, msgEl, fn) {
  msgEl.textContent = ''; msgEl.className = 'msg'; btn.disabled = true;
  try { await fn(); } catch (e) { msgEl.textContent = e.message; } finally { btn.disabled = false; }
}
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const act = fn => async () => { try { await fn(); } catch (e) { alert(e.message); } };

/* ---------- Auth ---------- */
function authTab(login) {
  $('loginBox').classList.toggle('hide', !login); $('regBox').classList.toggle('hide', login);
  $('tLogin').classList.toggle('on', login); $('tReg').classList.toggle('on', !login);
}
$('tLogin').onclick = () => authTab(true); $('tReg').onclick = () => authTab(false);
$('bReg').onclick = () => run($('bReg'), $('authMsg'), async () => {
  const r = await call('register', { name: $('rName').value, mobile: $('rMobile').value, code: $('rCode').value });
  $('cred').innerHTML = `<div class="cred"><b>Your ID:</b> ${esc(r.id)}<br><b>Password:</b> ${esc(r.password)}<br><small>Write these down, then log in.</small></div>`;
  $('lId').value = r.id; $('lPass').value = r.password;
});
$('bLogin').onclick = () => run($('bLogin'), $('authMsg'), async () => {
  const r = await call('login', { mobile: $('lId').value.trim(), password: $('lPass').value });
  token = r.token; localStorage.setItem('qtoken', token); start(r.profile);
});
function start(p) {
  me = p; $('auth').classList.add('hide'); $('app').classList.remove('hide');
  $('sub').textContent = 'Welcome, ' + p.name; go('lib');
}

/* ---------- Navigation ---------- */
function go(tab) {
  $('nLib').classList.toggle('on', tab === 'lib'); $('nPro').classList.toggle('on', tab === 'pro');
  if (tab === 'lib') { openFolder = null; loadLib(); } else renderProfile();
}
$('nLib').onclick = () => go('lib'); $('nPro').onclick = () => go('pro');

/* ---------- Library ---------- */
async function loadLib() { tree = await call('tree'); renderLib(); }
const byId = (a, id) => a.find(x => x.id === id);

// Moves an item up/down among its siblings, then saves the new order
async function move(type, id, dir, sibs) {
  const ids = sibs.map(s => s.id), i = ids.indexOf(id), j = i + dir;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  await call('reorder', { type, ids }); await loadLib();
}
function item(type, o, sibs, opts = {}) {
  const def = type === 'folder' && o.isDefault === true || o.isDefault === 'TRUE';
  const i = sibs.findIndex(s => s.id === o.id);
  const d = el(`<div class="box ${opts.sm ? 'sm' : ''}"><b>${esc(o.name)}</b></div>`);
  if (opts.onOpen) d.onclick = opts.onOpen;
  if (isAdmin()) {
    const btn = (t, label, fn, dis) => {
      const b = el(`<button class="ic" aria-label="${label}" ${dis ? 'disabled' : ''}>${t}</button>`);
      b.onclick = e => { e.stopPropagation(); act(fn)(); }; d.appendChild(b);
    };
    btn('▲', 'Move up', () => move(type, o.id, -1, sibs), i === 0);
    btn('▼', 'Move down', () => move(type, o.id, 1, sibs), i === sibs.length - 1);
    if (!def) {
      btn('✎', 'Rename', async () => {
        const n = prompt('New name', o.name); if (n === null) return;
        await call('rename', { type, id: o.id, name: n }); await loadLib();
      });
      btn('✕', 'Delete', async () => {
        if (!confirm(`Delete "${o.name}" and everything inside it?`)) return;
        await call('remove', { type, id: o.id }); await loadLib();
      });
    }
  }
  return d;
}
function addBtn(label, type, extra) {
  const b = el(`<button class="ghost">+ ${label}</button>`);
  b.onclick = act(async () => {
    const n = prompt(label); if (!n) return;
    await call('add', { type, name: n, ...extra }); await loadLib();
  });
  return b;
}
function topicItem(t, sibs) {
  return item('topic', t, sibs, { sm: true, onOpen: () => alert('Questions will be added in the next step.') });
}
function renderLib() {
  const v = $('view'); v.innerHTML = '';
  if (!openFolder) {
    v.appendChild(el('<h2>Folders</h2>'));
    tree.folders.forEach(f => v.appendChild(item('folder', f, tree.folders, { onOpen: () => { openFolder = f.id; renderLib(); } })));
    if (isAdmin()) v.appendChild(addBtn('Add folder', 'folder', {}));
    return;
  }
  const f = byId(tree.folders, openFolder), def = f.isDefault === true || f.isDefault === 'TRUE';
  const back = el('<button class="ghost" style="margin:0 0 12px">← All folders</button>');
  back.onclick = () => { openFolder = null; renderLib(); };
  v.appendChild(back); v.appendChild(el(`<h2>${esc(f.name)}</h2>`));
  const chs = tree.chapters.filter(c => c.folderId === f.id);
  const topicsOf = cid => tree.topics.filter(t => t.folderId === f.id && String(t.chapterId || '') === cid);
  if (!def) {
    chs.forEach(c => {
      v.appendChild(item('chapter', c, chs));
      const ts = topicsOf(c.id), wrap = el('<div class="indent"></div>');
      ts.forEach(t => wrap.appendChild(topicItem(t, ts)));
      if (!ts.length) wrap.appendChild(el('<div class="empty">No topics yet</div>'));
      if (isAdmin()) wrap.appendChild(addBtn('Add topic', 'topic', { folderId: f.id, chapterId: c.id }));
      v.appendChild(wrap);
    });
    if (isAdmin()) v.appendChild(addBtn('Add chapter', 'chapter', { folderId: f.id }));
    v.appendChild(el('<h2 style="margin-top:18px">Topics without a chapter</h2>'));
  }
  const ts = topicsOf('');
  ts.forEach(t => v.appendChild(topicItem(t, ts)));
  if (!ts.length) v.appendChild(el('<div class="empty">No topics yet</div>'));
  if (isAdmin()) v.appendChild(addBtn('Add topic', 'topic', { folderId: f.id, chapterId: '' }));
}

/* ---------- Profile ---------- */
function renderProfile() {
  const ph = me.photo || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90"><rect width="90" height="90" fill="#cfd8d6"/><circle cx="45" cy="36" r="15" fill="#fff"/><rect x="19" y="55" width="52" height="28" rx="14" fill="#fff"/></svg>');
  $('view').innerHTML = `
  <div class="card"><img id="pic" class="avatar" src="${ph}" alt="Profile photo">
    <input id="file" type="file" accept="image/*" class="hide">
    <button class="ghost" id="bPic">Change photo</button>
    <label>Name</label><input id="pName" value="${esc(me.name)}">
    <label>ID</label><input value="${esc(me.mobile)}" disabled>
    <button id="bSave">Save</button><div class="msg" id="pMsg"></div></div>
  <div class="card"><h2>Change password</h2>
    <label>Current password</label><input id="oldP" type="password" autocomplete="current-password">
    <label>New password</label><input id="newP" type="password" autocomplete="new-password">
    <button id="bPass">Change password</button><div class="msg" id="passMsg"></div></div>
  ${isAdmin() ? `<div class="card"><h2>Admin: secret codes</h2>
    <label>How many codes?</label><input id="cCount" type="number" min="1" max="100" value="5">
    <button id="bCodes">Generate codes</button><div id="codeList"></div><div class="msg" id="cMsg"></div></div>
  <div class="card"><h2>Who can add questions</h2><div id="userList"></div></div>` : ''}
  <button class="ghost" id="bOut">Log out</button>`;
  $('bPic').onclick = () => $('file').click();
  $('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'), m = Math.min(img.width, img.height); c.width = c.height = 200;
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 200, 200);
      $('pic').src = c.toDataURL('image/jpeg', 0.7);
      $('pMsg').textContent = 'Press Save to keep the new photo'; $('pMsg').className = 'msg ok';
    };
    img.src = URL.createObjectURL(f);
  };
  $('bSave').onclick = () => run($('bSave'), $('pMsg'), async () => {
    const photo = $('pic').src.startsWith('data:image/jpeg') ? $('pic').src : undefined;
    me = await call('updateProfile', { name: $('pName').value, photo });
    $('sub').textContent = 'Welcome, ' + me.name; $('pMsg').textContent = 'Saved'; $('pMsg').className = 'msg ok';
  });
  $('bPass').onclick = () => run($('bPass'), $('passMsg'), async () => {
    await call('changePassword', { oldPassword: $('oldP').value, newPassword: $('newP').value });
    $('oldP').value = $('newP').value = ''; $('passMsg').textContent = 'Password changed'; $('passMsg').className = 'msg ok';
  });
  $('bOut').onclick = () => { localStorage.removeItem('qtoken'); location.reload(); };
  if (isAdmin()) {
    $('bCodes').onclick = () => run($('bCodes'), $('cMsg'), async () => {
      const l = await call('addCodes', { count: +$('cCount').value });
      $('codeList').innerHTML = '<div class="cred">' + l.join('<br>') + '</div>';
    });
    loadUsers();
  }
}
async function loadUsers() {
  const list = (await call('listUsers')).filter(u => u.role !== 'admin'), box = $('userList');
  box.innerHTML = list.length ? '' : '<div class="empty">No users yet</div>';
  list.forEach(u => {
    const d = el(`<div class="row"><div>${esc(u.name)}<br><small>${esc(u.mobile)}</small></div></div>`);
    const b = el(`<button class="ghost">${u.canAdd ? 'Remove access' : 'Allow'}</button>`);
    b.onclick = act(async () => { await call('setPermission', { mobile: u.mobile, canAdd: !u.canAdd }); loadUsers(); });
    d.appendChild(b); box.appendChild(d);
  });
}

if (token) call('me').then(start).catch(() => localStorage.removeItem('qtoken'));
</script>
</body>
</html>
